<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sommelier — Voice Wine Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
<style>
  /* ── Reset & base ───────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --obsidian:   #0c0a0e;
    --cellar:     #130f18;
    --dark-wine:  #1a0d1a;
    --burgundy:   #6b1a2a;
    --crimson:    #8b2336;
    --ruby:       #c0392b;
    --rose-gold:  #c9956a;
    --gold:       #d4a853;
    --parchment:  #e8d9b8;
    --cream:      #f2ead8;
    --muted:      #7a6e62;
    --border:     rgba(201, 149, 106, 0.18);
    --glow:       rgba(192, 57, 43, 0.35);
    --radius:     4px;
  }

  html, body {
    height: 100%;
    background: var(--obsidian);
    color: var(--parchment);
    font-family: 'Crimson Pro', Georgia, serif;
    font-weight: 300;
    font-size: 18px;
    line-height: 1.65;
    overflow-x: hidden;
  }

  /* ── Grain overlay ─────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.032;
    pointer-events: none;
    z-index: 9999;
  }

  /* ── Atmospheric radial glow ───────────────────────────── */
  body::after {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 80vw;
    height: 60vh;
    background: radial-gradient(ellipse at 50% 0%, rgba(107,26,42,0.28) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Layout ─────────────────────────────────────────────── */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr;
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    padding: 48px 0 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream);
    line-height: 1;
    margin-bottom: 6px;
  }

  .wordmark em {
    font-style: italic;
    color: var(--rose-gold);
  }

  .tagline {
    font-family: 'Crimson Pro', serif;
    font-size: 0.9rem;
    font-weight: 300;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* decorative rule */
  .rule {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 18px auto 0;
    width: fit-content;
  }
  .rule-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose-gold));
  }
  .rule-line:last-child { background: linear-gradient(90deg, var(--rose-gold), transparent); }
  .rule-diamond {
    width: 5px; height: 5px;
    background: var(--rose-gold);
    transform: rotate(45deg);
    opacity: 0.7;
  }

  /* ── Main content ───────────────────────────────────────── */
  main {
    padding: 48px 0 40px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  /* ── Mic orb ────────────────────────────────────────────── */
  .mic-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .mic-btn {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: radial-gradient(circle at 38% 36%, #2e1020 0%, #150a14 60%, #0c0810 100%);
    box-shadow:
      0 0 0 1px rgba(201,149,106,0.25),
      0 0 24px rgba(107,26,42,0.45),
      0 8px 32px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.2s ease, box-shadow 0.25s ease;
    outline: none;
  }

  .mic-btn:hover {
    transform: scale(1.05);
    box-shadow:
      0 0 0 1px rgba(201,149,106,0.4),
      0 0 36px rgba(139,35,54,0.55),
      0 12px 40px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.07);
  }

  .mic-btn:active { transform: scale(0.97); }

  /* rings */
  .mic-btn::before,
  .mic-btn::after {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 1px solid rgba(201,149,106,0.12);
    animation: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .mic-btn::after { inset: -22px; border-color: rgba(201,149,106,0.07); }

  .mic-btn.listening::before,
  .mic-btn.listening::after {
    opacity: 1;
    animation: ring-pulse 1.6s ease-out infinite;
  }
  .mic-btn.listening::after { animation-delay: 0.5s; }

  @keyframes ring-pulse {
    0%   { transform: scale(0.92); opacity: 0.6; }
    100% { transform: scale(1.18); opacity: 0; }
  }

  /* orb glow when listening */
  .mic-btn.listening {
    box-shadow:
      0 0 0 1px rgba(192,57,43,0.5),
      0 0 48px rgba(192,57,43,0.6),
      0 0 80px rgba(107,26,42,0.45),
      0 12px 40px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.07);
  }

  /* mic icon */
  .mic-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }

  .mic-icon svg {
    width: 34px;
    height: 34px;
    fill: var(--rose-gold);
    filter: drop-shadow(0 0 6px rgba(201,149,106,0.4));
    transition: fill 0.25s, filter 0.25s;
  }

  .mic-btn.listening .mic-icon svg {
    fill: #e85555;
    filter: drop-shadow(0 0 10px rgba(232,85,85,0.7));
  }

  /* spinner overlay */
  .spinner-ring {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    border-top-color: var(--rose-gold);
    border-right-color: rgba(201,149,106,0.3);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .mic-btn.processing .spinner-ring {
    opacity: 1;
    animation: spin 0.9s linear infinite;
  }

  .mic-btn.processing .mic-icon { opacity: 0.25; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .mic-label {
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.3s;
    font-weight: 400;
  }

  .mic-btn.listening ~ .mic-label { color: #e85555; }
  .mic-btn.processing ~ .mic-label { color: var(--rose-gold); }

  /* ── Transcript ──────────────────────────────────────────── */
  .transcript-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .field-label {
    font-size: 0.68rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }

  .transcript-box {
    min-height: 52px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'Crimson Pro', serif;
    font-size: 1.05rem;
    font-style: italic;
    color: var(--cream);
    line-height: 1.55;
    transition: border-color 0.3s, background 0.3s;
    position: relative;
    overflow: hidden;
  }

  .transcript-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--rose-gold), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .transcript-box.active { border-color: rgba(201,149,106,0.4); }
  .transcript-box.active::before { opacity: 1; }
  .transcript-box.empty { color: var(--muted); font-style: normal; font-size: 0.88rem; }

  /* cursor blink while listening */
  .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--rose-gold);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.9s step-end infinite;
  }

  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ── Answer ──────────────────────────────────────────────── */
  .answer-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .answer-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sommelier-badge {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sommelier-badge svg {
    width: 14px; height: 14px;
    fill: var(--gold);
    opacity: 0.8;
    flex-shrink: 0;
  }

  .answer-box {
    min-height: 110px;
    padding: 20px 22px;
    background: linear-gradient(135deg, rgba(107,26,42,0.1) 0%, rgba(20,12,22,0.6) 100%);
    border: 1px solid rgba(107,26,42,0.35);
    border-radius: var(--radius);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.2rem;
    font-weight: 300;
    color: var(--cream);
    line-height: 1.75;
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s;
  }

  .answer-box::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle at 100% 100%, rgba(107,26,42,0.18) 0%, transparent 65%);
    pointer-events: none;
  }

  .answer-box.has-answer { border-color: rgba(139,35,54,0.5); }
  .answer-box.empty { color: var(--muted); font-family: 'Crimson Pro', serif; font-size: 0.88rem; font-weight: 300; font-style: italic; }

  .answer-text {
    position: relative;
    z-index: 1;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .answer-text.visible { opacity: 1; transform: translateY(0); }

  /* speaking indicator */
  .speaking-dots {
    display: none;
    gap: 5px;
    align-items: center;
    margin-top: 10px;
  }

  .speaking-dots.active { display: flex; }

  .speaking-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--rose-gold);
    animation: dot-bounce 1.2s ease-in-out infinite;
  }
  .speaking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .speaking-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scaleY(0.6); opacity: 0.4; }
    40%           { transform: scaleY(1.4); opacity: 1; }
  }

  /* ── Example pills ──────────────────────────────────────── */
  .examples-section { display: flex; flex-direction: column; gap: 12px; }

  .examples-label {
    font-size: 0.68rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pill {
    padding: 8px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 24px;
    font-family: 'Crimson Pro', serif;
    font-size: 0.88rem;
    color: var(--parchment);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
    line-height: 1.3;
    user-select: none;
  }

  .pill:hover {
    background: rgba(107,26,42,0.25);
    border-color: rgba(139,35,54,0.55);
    color: var(--cream);
    transform: translateY(-1px);
  }

  .pill:active { transform: translateY(0); }

  /* ── Footer ─────────────────────────────────────────────── */
  footer {
    padding: 20px 0 32px;
    text-align: center;
    border-top: 1px solid var(--border);
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: rgba(122,110,98,0.5);
    text-transform: uppercase;
  }

  /* ── Entrance animations ────────────────────────────────── */
  .fade-up {
    opacity: 0;
    transform: translateY(20px);
    animation: fade-up-in 0.7s ease forwards;
  }

  @keyframes fade-up-in {
    to { opacity: 1; transform: translateY(0); }
  }

  header           { animation: fade-up-in 0.7s 0.05s ease both; }
  .mic-stage       { animation: fade-up-in 0.7s 0.18s ease both; }
  .transcript-section { animation: fade-up-in 0.7s 0.28s ease both; }
  .answer-section  { animation: fade-up-in 0.7s 0.38s ease both; }
  .examples-section{ animation: fade-up-in 0.7s 0.48s ease both; }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 520px) {
    .page { padding: 0 16px; }
    .wordmark { letter-spacing: 0.1em; }
    .pill { font-size: 0.82rem; }
    .answer-box { font-size: 1.05rem; }
  }

  /* ── Error state ─────────────────────────────────────────── */
  .error-text { color: #e85555; font-size: 0.9rem; font-style: italic; }

  /* no-speech notice */
  .notice {
    display: none;
    font-size: 0.8rem;
    color: #c0392b;
    letter-spacing: 0.06em;
    text-align: center;
    padding: 8px 12px;
    border: 1px solid rgba(192,57,43,0.3);
    border-radius: var(--radius);
    background: rgba(192,57,43,0.06);
  }

  .notice.visible { display: block; }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header>
    <div class="wordmark"><em>Le</em> Sommelier</div>
    <div class="tagline">Voice Wine Explorer</div>
    <div class="rule">
      <div class="rule-line"></div>
      <div class="rule-diamond"></div>
      <div class="rule-line"></div>
    </div>
  </header>

  <!-- Main -->
  <main>

    <!-- Mic button -->
    <section class="mic-stage">
      <button class="mic-btn" id="micBtn" aria-label="Start voice input" title="Tap to speak">
        <div class="spinner-ring"></div>
        <div class="mic-icon">
          <!-- microphone SVG -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21H9v2h6v-2h-2v-2.07A8.001 8.001 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8.001 8.001 0 0 0 7 7.93z"/>
          </svg>
        </div>
      </button>
      <span class="mic-label" id="micLabel">Tap to speak</span>
    </section>

    <!-- Browser notice -->
    <div class="notice" id="speechNotice">
      Your browser does not support the Web Speech API. Try Chrome or Edge.
    </div>

    <!-- Transcript -->
    <section class="transcript-section">
      <div class="field-label">Your question</div>
      <div class="transcript-box empty" id="transcriptBox">Ask me anything about wine…</div>
    </section>

    <!-- Answer -->
    <section class="answer-section">
      <div class="answer-header">
        <div class="field-label sommelier-badge">
          <!-- grape / wine glass icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.5 2h-13L2 9c0 3.53 2.61 6.44 6 6.92V18H6v2h12v-2h-2v-2.08C19.39 15.44 22 12.53 22 9l-3.5-7zm-1.84 2L18.47 9H5.53l1.81-5h9.32zM12 14a5 5 0 0 1-5-5h10a5 5 0 0 1-5 5z"/>
          </svg>
          Sommelier says
        </div>
      </div>
      <div class="answer-box empty" id="answerBox">
        <div class="answer-text" id="answerText">Your answer will appear here…</div>
        <div class="speaking-dots" id="speakingDots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </section>

    <!-- Example pills -->
    <section class="examples-section">
      <div class="examples-label">Try asking</div>
      <div class="pills">
        <button class="pill" data-q="Which are the best-rated wines under $50?">Best-rated under $50?</button>
        <button class="pill" data-q="What do you have from Burgundy?">Wines from Burgundy?</button>
        <button class="pill" data-q="What's the most expensive bottle you have?">Most expensive bottle?</button>
        <button class="pill" data-q="Which bottles would make a good housewarming gift?">Housewarming gift ideas?</button>
      </div>
    </section>

  </main>

  <footer>Est. in the cellar &nbsp;·&nbsp; Powered by Claude &amp; OpenAI</footer>

</div>

<script>
const BACKEND = 'http://localhost:8000';

// ── DOM refs ─────────────────────────────────────────────
const micBtn        = document.getElementById('micBtn');
const micLabel      = document.getElementById('micLabel');
const transcriptBox = document.getElementById('transcriptBox');
const answerBox     = document.getElementById('answerBox');
const answerText    = document.getElementById('answerText');
const speakingDots  = document.getElementById('speakingDots');
const speechNotice  = document.getElementById('speechNotice');

// ── State ─────────────────────────────────────────────────
let recognition   = null;
let isListening   = false;
let isProcessing  = false;
let currentUtter  = null;

// ── Speech Recognition setup ──────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  speechNotice.classList.add('visible');
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.continuous      = false;
  recognition.interimResults  = true;
  recognition.lang            = 'en-US';

  recognition.onstart = () => {
    isListening = true;
    setMicState('listening');
    setTranscript('', true);
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      e.results[i].isFinal ? (final += t) : (interim += t);
    }
    setTranscript((final || interim), !final);
  };

  recognition.onend = () => {
    isListening = false;
    const q = transcriptBox.dataset.query || '';
    if (q.trim()) {
      askQuestion(q.trim());
    } else {
      setMicState('idle');
    }
  };

  recognition.onerror = (e) => {
    isListening = false;
    if (e.error !== 'no-speech') {
      showError('Microphone error: ' + e.error);
    }
    setMicState('idle');
  };
}

// ── Mic button click ──────────────────────────────────────
micBtn.addEventListener('click', () => {
  if (isProcessing) return;

  // stop speaking if active
  if (currentUtter) {
    window.speechSynthesis.cancel();
    currentUtter = null;
    speakingDots.classList.remove('active');
  }

  if (isListening) {
    recognition.stop();
  } else {
    try {
      recognition.start();
    } catch(err) {
      // already started
    }
  }
});

// ── Example pills ─────────────────────────────────────────
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    if (isProcessing || isListening) return;
    const q = pill.dataset.q;
    setTranscript(q, false);
    askQuestion(q);
  });
});

// ── Ask backend ───────────────────────────────────────────
async function askQuestion(question) {
  setMicState('processing');
  clearAnswer();

  try {
    const res = await fetch(`${BACKEND}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    showAnswer(data.answer);
    speak(data.answer);
  } catch (err) {
    showError('Could not reach the sommelier: ' + err.message);
  } finally {
    isProcessing = false;
    setMicState('idle');
  }
}

// ── UI helpers ────────────────────────────────────────────
function setMicState(state) {
  micBtn.classList.remove('listening', 'processing');
  isProcessing = (state === 'processing');

  if (state === 'listening') {
    micBtn.classList.add('listening');
    micLabel.textContent = 'Listening… tap to stop';
    micBtn.setAttribute('aria-label', 'Stop listening');
  } else if (state === 'processing') {
    micBtn.classList.add('processing');
    micLabel.textContent = 'Consulting the cellar…';
    micBtn.setAttribute('aria-label', 'Processing');
  } else {
    micLabel.textContent = 'Tap to speak';
    micBtn.setAttribute('aria-label', 'Start voice input');
  }
}

function setTranscript(text, interim) {
  transcriptBox.dataset.query = text;

  if (!text) {
    transcriptBox.classList.add('empty');
    transcriptBox.classList.remove('active');
    transcriptBox.innerHTML = 'Ask me anything about wine…';
    return;
  }

  transcriptBox.classList.remove('empty');
  transcriptBox.classList.add('active');

  if (interim) {
    transcriptBox.innerHTML = escHtml(text) + '<span class="cursor"></span>';
  } else {
    transcriptBox.textContent = text;
  }
}

function clearAnswer() {
  answerBox.classList.remove('has-answer', 'empty');
  answerText.classList.remove('visible');
  speakingDots.classList.remove('active');
  answerText.textContent = '';
}

function showAnswer(text) {
  answerBox.classList.remove('empty');
  answerBox.classList.add('has-answer');
  answerText.textContent = text;

  // trigger reflow for transition
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      answerText.classList.add('visible');
    });
  });
}

function showError(msg) {
  answerBox.classList.remove('empty');
  answerBox.classList.add('has-answer');
  answerText.innerHTML = `<span class="error-text">${escHtml(msg)}</span>`;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => { answerText.classList.add('visible'); });
  });
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── TTS ───────────────────────────────────────────────────
function speak(text) {
  if (!window.speechSynthesis) return;

  window.speechSynthesis.cancel();

  currentUtter = new SpeechSynthesisUtterance(text);
  currentUtter.lang  = 'en-US';
  currentUtter.rate  = 0.93;
  currentUtter.pitch = 1.0;

  // prefer a richer voice if available
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v =>
    /samantha|karen|moira|fiona|daniel|oliver|arthur|google uk english/i.test(v.name)
  ) || voices.find(v => v.lang === 'en-US' && v.localService) || null;
  if (preferred) currentUtter.voice = preferred;

  currentUtter.onstart = () => speakingDots.classList.add('active');
  currentUtter.onend   = () => {
    speakingDots.classList.remove('active');
    currentUtter = null;
  };
  currentUtter.onerror = () => {
    speakingDots.classList.remove('active');
    currentUtter = null;
  };

  // Chrome bug: voices may not be loaded yet
  setTimeout(() => window.speechSynthesis.speak(currentUtter), 80);
}

// pre-load voices
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
</script>
